name: Build and Release Curio Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Select target devices or OS group to build'
        required: true
        type: choice
        options:
          - ALL
          - A16
          - A15
          - A14
          - OP13
          - android16-6.12
          - android15-6.6
          - android14-6.1
          - android13-5.15
          - android12-5.10
        default: A16
      make_release:
        description: 'Create draft GitHub Release with built artifacts'
        required: false
        type: boolean
        default: false
      clean_build:
        description: 'Clean build (bypass ccache)'
        required: false
        type: boolean
        default: false
      debug:
        description: 'Dump debug artifacts (vmlinux, System.map, build.log)'
        required: false
        type: boolean
        default: false

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      device_count: ${{ steps.set-matrix.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_HTTP_TIMEOUT: 600
    steps:
      - name: Checkout Code (to access configs/)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            configs/
          sparse-checkout-cone-mode: false

      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Matrix generation"

          input="${{ inputs.target }}"

          echo "[" > matrix.json
          mapfile -t all_json_files < <(find configs/ -name "*.json" -print0 | xargs -0 -n1)
          for i in "${!all_json_files[@]}"; do
            file="${all_json_files[$i]}"
            if [ -f "$file" ]; then
              jq -r '.' "$file" >> matrix.json
              if [ $((i+1)) -lt ${#all_json_files[@]} ]; then
                echo "," >> matrix.json
              fi
            fi
          done
          echo "]" >> matrix.json

          case "$input" in
            ALL)
              jq_filter="."
              ;;
            A16|A15|A14)
              jq_filter="map(select(.os_version == \"$input\"))"
              ;;
            android*-*.*)
              IFS='-' read -r av kv <<< "$input"
              jq_filter="map(select(.android_version == \"$av\" and .kernel_version == \"$kv\"))"
              ;;
            *)
              jq_filter="map(select(.model == \"$input\"))"
              ;;
          esac

          filtered=$(jq -c "$jq_filter" matrix.json)
          count=$(jq 'length' <<<"$filtered")

          if [ "$count" -eq 0 ]; then
            echo "::error::No config files found for target '$input'!"
            echo "Available configurations:"
            jq -r '.[] | "  - \(.model) (\(.os_version), \(.android_version)-\(.kernel_version))"' matrix.json
            exit 1
          fi

          merged_matrix=$(echo "$filtered" | jq '
            sort_by(
              (.os_version | gsub("A"; "") | tonumber? // 0) * -1,
              .model
            )
          ')

          echo "[OK] Found $count device(s) to build:"
          jq -r '.[] | "  - \(.model) (\(.os_version), \(.android_version)-\(.kernel_version))"' <<<"$merged_matrix"

          echo "count=$count" >> "$GITHUB_OUTPUT"
          wrapped=$(jq -n --argjson items "$merged_matrix" '{ include: $items }')
          echo "matrix=$(jq -c . <<< "$wrapped")" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Build plan summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Curio Kernel Build Plan

          - **Target:** `${{ inputs.target }}` (${{ steps.set-matrix.outputs.count }} device(s))
          - **Artifacts:** AnyKernel3 ZIP + 96MB GKI `boot.img`
          - **Clean Build:** ${{ inputs.clean_build && 'Yes' || 'No' }}
          - **Create Release:** ${{ inputs.make_release && 'Yes' || 'No' }}
          - **Debug Mode:** ${{ inputs.debug && 'Yes' || 'No' }}
          EOF

  prepare_ccache:
    name: Prepare ccache binary (download once)
    runs-on: ubuntu-latest
    steps:
      - name: Download custom ccache once
        run: |
          set -uo pipefail
          echo "::group::Download ccache"
          url="https://raw.githubusercontent.com/UlasuNoka/curio-kernel-patches/41ee35ca795910495dafe72c1c18bdce0a5d6f70/ccache/ccache-x86-64"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -LfsS --connect-timeout 30 --max-time 120 -H "User-Agent: Mozilla/5.0" "$url" -o ccache && [ -s ccache ]; then
              ok=1; break
            fi
            echo "attempt $attempt failed; backing off..."
            sleep $(( attempt * 5 + RANDOM % 6 ))
          done
          if [ "$ok" = 1 ]; then
            echo "[OK] downloaded ccache once for all matrix jobs"
          else
            echo "::warning::custom ccache download failed; matrix jobs will fall back to the apt ccache"
            rm -f ccache
          fi
          echo "::endgroup::"
      - name: Upload ccache artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccache-binary
          path: ccache
          retention-days: 1
          if-no-files-found: warn

  build:
    name: build (${{ matrix.model }}, ${{ matrix.os_version }}, ${{ matrix.android_version }}-${{ matrix.kernel_version }})
    needs: [generate-matrix, prepare_ccache]
    if: ${{ !cancelled() && needs.generate-matrix.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Emergency Disk Cleanup
        if: ${{ matrix.disk_cleanup }}
        uses: ./.github/actions/disk-cleanup

      - name: Install Minimal Dependencies
        run: |
          set -euo pipefail
          echo "::group::Install dependencies"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev lz4 \
            libxml2-utils rsync unzip zip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils pigz aria2 zstd wget
          sudo apt-get clean
          echo "[OK] Dependencies installed"
          echo "::endgroup::"

      - name: Get prebuilt ccache
        uses: actions/download-artifact@v8
        with:
          name: ccache-binary
          path: ccache-dl
        continue-on-error: true

      - name: Install ccache
        run: |
          set -uo pipefail
          echo "::group::Install ccache"
          if [ -s ccache-dl/ccache ]; then
            sudo cp -f ccache-dl/ccache /usr/bin/ccache
            sudo chmod +x /usr/bin/ccache
            echo "[OK] installed custom ccache from shared artifact"
          else
            echo "::warning::shared ccache artifact unavailable; using apt ccache"
          fi
          rm -rf ccache-dl
          echo "[DEBUG] Ccache version : $(ccache --version | head -1)"
          echo "::endgroup::"

      - name: Configure ccache
        run: |
          echo "::group::Configure ccache environment"
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            CACHE_DIR="${{ github.workspace }}/.ccache"
            CCACHE_LOG="${{ github.workspace }}/ccache.log"
            mkdir -p "$CACHE_DIR"

            SETTINGS=(
              "CCACHE_DIR=$CACHE_DIR"
              "CCACHE_MAXSIZE=12G"
              "CCACHE_COMPILERCHECK=content"
              "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
              "CCACHE_NOHASHDIR=true"
              "CCACHE_IGNOREOPTIONS=--sysroot*"
              "CCACHE_COMPRESSION=true"
              "CCACHE_COMPRESSION_LEVEL=3"
              "CCACHE_DIRECT=true"
              "CCACHE_FILE_CLONE=true"
              "CCACHE_INODE_CACHE=true"
              "CCACHE_IS_KERNEL_COMPILING=true"
              "CCACHE_UMASK=002"
              "CCACHE_LOGFILE=${CCACHE_LOG}"
              "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale"
            )

            for setting in "${SETTINGS[@]}"; do
              export "$setting"
              echo "$setting" >> "$GITHUB_ENV"
            done

            if ccache --help 2>&1 | grep -q 'depend_mode'; then
              export CCACHE_DEPEND=true
              echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"
            fi

            echo "[OK] ccache configured successfully"
            ccache -p
          fi
          echo "::endgroup::"

      - name: Prepare op_config_json
        id: prepare_config
        shell: bash
        run: |
          echo "config_json=$(jq -nc --argjson m '${{ toJSON(matrix) }}' '$m')" >> "$GITHUB_OUTPUT"

      - name: Build Kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.prepare_config.outputs.config_json }}
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.debug }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Final cleanup and space report
        if: always()
        run: |
          echo "::group::Cleanup"
          sudo rm -rf "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/kernel/out" "$GITHUB_WORKSPACE/.repo" /tmp/* || true
          df -h /
          echo "::endgroup::"

  trigger-release:
    needs: [generate-matrix, build]
    runs-on: ubuntu-latest
    if: |
      !cancelled() &&
      inputs.make_release == true &&
      needs.build.result == 'success' &&
      needs.generate-matrix.result == 'success'
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: 'Curio Kernels — ${{ github.run_id }}'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate and Create New Tag
        run: |
          BUILD_DATE=$(date -u '+%Y%m%d-%H%M')
          NEW_TAG="kernel-${BUILD_DATE}"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Generate Release Notes
        run: |
          cat << EOF > release_notes.md
          # Curio Kernels

          > **Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          > **Build ID:** \`${{ github.run_id }}\`
          > **Workflow:** [\`${{ github.workflow }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---

          ## Built Artifacts

          Each device build provides two installation options:
          - **`AK3_*.zip`** — Flashable AnyKernel3 package (via Kernel Flasher / Horizon).
          - **`boot_*.img`** — Standalone 96MB GKI Boot Image v4 (ready for APatch / FolkPatch patching or \`fastboot flash boot\`).

          ---

          ## Features

          - HMBIRD SCX Scheduler
          - BBRv3 TCP Congestion Control
          - Baseband Guard (BBG)
          - TTL Target Support
          - IP_SET & IPv6 NAT
          - Unicode Fix
          - Droidspaces (Linux containers)
          - NTSync

          > This build contains the kernel only; no root framework is pre-injected.
          EOF

      - name: Create GitHub Release
        run: |
          gh release create "$NEW_TAG" \
            --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" \
            --title "${{ env.RELEASE_NAME }}" \
            --notes-file release_notes.md \
            --draft

      - name: Upload Release Assets
        run: |
          shopt -s nullglob
          for file in ./downloaded-artifacts/*.zip ./downloaded-artifacts/*.img; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              gh release upload "$NEW_TAG" "$file" --clobber
            fi
          done
