name: Curio Kernel CI

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: 'Target OS version group'
        required: true
        type: choice
        options:
          - A16
          - ALL
          - A15
          - A14
        default: A16
      kernel_version:
        description: 'Target GKI kernel branch'
        required: true
        type: choice
        options:
          - ALL
          - android16-6.12
          - android15-6.6
          - android14-6.1
          - android13-5.15
          - android12-5.10
        default: ALL
      device:
        description: 'Target device model'
        required: true
        type: choice
        options:
          - ALL
          - OP13
        default: ALL
      custom_filter:
        description: 'Custom filter (e.g. "OP13, OP12", "a16/OP13", "OP13*", "!OP13T")'
        required: false
        type: string
        default: ''
      make_release:
        description: 'Create draft GitHub Release with built artifacts'
        required: false
        type: boolean
        default: false
      clean_build:
        description: 'Clean build (bypass ccache)'
        required: false
        type: boolean
        default: false
      debug:
        description: 'Dump debug artifacts (vmlinux, System.map, build.log)'
        required: false
        type: boolean
        default: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout Target Profiles
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            targets/
            .github/scripts/
            .github/actions/kernel-pipeline/config/protected_modules.txt
          sparse-checkout-cone-mode: false

      - name: Resolve Build Matrix
        id: resolve
        shell: bash
        env:
          INPUT_OS: ${{ inputs.os_version }}
          INPUT_KERNEL: ${{ inputs.kernel_version }}
          INPUT_DEVICE: ${{ inputs.device }}
          INPUT_FILTER: ${{ inputs.custom_filter }}
        run: python3 .github/scripts/targets.py plan

  build:
    name: build (${{ matrix.id }} [${{ matrix.variant }}], ${{ matrix.os }}, ${{ matrix.gki }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Provision Runner
        uses: ./.github/actions/runner-setup
        with:
          prune_disk: ${{ matrix.prune_disk }}
          ccache_max_size: '12G'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Kernel Pipeline
        uses: ./.github/actions/kernel-pipeline
        with:
          profile: ${{ matrix.profile }}
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.debug }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-Run Workspace Cleanup
        if: always()
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          sudo rm -rf "${GITHUB_WORKSPACE}/${TARGET_ID}" \
            "${GITHUB_WORKSPACE}/kernel_patches" \
            "${GITHUB_WORKSPACE}/bbg_src" \
            "${GITHUB_WORKSPACE}/gki_verifier" || true
          df -h /

  publish-release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    if: |
      !cancelled() &&
      inputs.make_release == true &&
      needs.build.result == 'success' &&
      needs.plan.result == 'success'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_REPO: ${{ github.repository }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Release Tag
        run: |
          TAG="curio-$(date -u '+%Y%m%d-%H%M')"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Collect Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Create Draft Release & Upload Assets
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'PYREL'
          import datetime
          import glob
          import hashlib
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          run_id = os.environ["RUN_ID"]
          now_utc = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          files = sorted(
              glob.glob("./release-artifacts/*.zip") + glob.glob("./release-artifacts/*.img")
          )
          rows = []
          for fp in files:
              name = os.path.basename(fp)
              size_mib = os.path.getsize(fp) / (1024 * 1024)
              h = hashlib.sha256()
              with open(fp, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              digest = h.hexdigest()

              if name.startswith("AK3_"):
                  kind = "AnyKernel3"
                  stem = name[4:-4]
              elif name.startswith("boot_"):
                  kind = "Boot Image"
                  stem = name[5:-4]
              else:
                  kind = "Artifact"
                  stem = name

              m = re.match(r"^(.+?)_(A[0-9]+)_(android[0-9]+-[0-9]+\.[0-9]+\.[0-9]+)$", stem)
              if m:
                  target_desc = f"`{m.group(1)}` (`{m.group(2)}`, `{m.group(3)}`)"
              else:
                  target_desc = f"`{stem}`"

              rows.append(f"| {target_desc} | `{name}` | {kind} | {size_mib:.1f} MiB | `{digest}` |")

          with open("release_notes.md", "w", encoding="utf-8") as out:
              out.write(f"# Curio Kernel (`{tag}`)\n\n")
              out.write(f"- Build Date: `{now_utc}`\n")
              out.write(f"- Workflow Run: `{run_id}`\n\n")
              out.write("## Artifacts\n\n")
              out.write("| Target | File | Type | Size | SHA256 |\n")
              out.write("|---|---|---|---|---|\n")
              for r in rows:
                  out.write(r + "\n")
              out.write("\nKernel only (no pre-injected root framework). Original OEM AVB VBMETA is preserved in `boot_*.img`.\n")
          PYREL

          gh release create "$RELEASE_TAG" \
            --repo "$TARGET_REPO" \
            --title "Curio Kernel ${RELEASE_TAG}" \
            --notes-file release_notes.md \
            --draft

          shopt -s nullglob
          for f in ./release-artifacts/*.zip ./release-artifacts/*.img; do
            gh release upload "$RELEASE_TAG" "$f" --repo "$TARGET_REPO" --clobber
          done
