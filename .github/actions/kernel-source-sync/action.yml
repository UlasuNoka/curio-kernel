name: 'Download and configure Kernel Source code'
description: 'Resolve device XML manifest and sync kernel repositories and prebuilt toolchains in parallel.'

inputs:
  source_location:
    description: 'Folder path to save Kernel source'
    required: true
  github_token:
    description: 'GitHub Token'
    required: true
  debug:
    description: 'Enable Logs'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Download and Prepare Manifest
      shell: bash
      working-directory: ${{ inputs.source_location }}
      run: |
        set -euo pipefail
        OS_LOWER=$(echo "$OP_OS_VERSION" | tr '[:upper:]' '[:lower:]')
        CFG_DIR="${OP_CONFIG_DIR:-${OS_LOWER}/${OP_MODEL}}"

        if [[ "${OP_MANIFEST:-}" == https://* ]]; then
          echo "Fetching remote manifest URL: $OP_MANIFEST"
          curl --fail --show-error --location --proto '=https' "$OP_MANIFEST" -o manifest.xml
        elif [ -n "${OP_MANIFEST:-}" ] && [ -f "${GITHUB_WORKSPACE}/manifests/${CFG_DIR}/${OP_MANIFEST}" ]; then
          echo "Using device manifest: manifests/${CFG_DIR}/${OP_MANIFEST}"
          cp "${GITHUB_WORKSPACE}/manifests/${CFG_DIR}/${OP_MANIFEST}" manifest.xml
        elif [ -n "${OP_MANIFEST:-}" ] && [ -f "${GITHUB_WORKSPACE}/manifests/${OS_LOWER}/${OP_MANIFEST}" ]; then
          echo "Using OS-level manifest: manifests/${OS_LOWER}/${OP_MANIFEST}"
          cp "${GITHUB_WORKSPACE}/manifests/${OS_LOWER}/${OP_MANIFEST}" manifest.xml
        else
          # Auto-detect single .xml in device manifest folder if name differs
          AUTO_XML=$(find "${GITHUB_WORKSPACE}/manifests/${CFG_DIR}" -maxdepth 1 -type f -name "*.xml" 2>/dev/null | head -n 1 || true)
          if [ -n "$AUTO_XML" ]; then
            echo "Auto-detected device manifest: ${AUTO_XML#"${GITHUB_WORKSPACE}/"}"
            cp "$AUTO_XML" manifest.xml
          else
            OSS_URL="https://raw.githubusercontent.com/OnePlusOSS/kernel_manifest/refs/heads/${OP_BRANCH}/${OP_MANIFEST}"
            echo "Fetching manifest from OnePlusOSS: $OSS_URL"
            curl --fail --show-error --location --proto '=https' "$OSS_URL" -o manifest.xml
          fi
        fi

    - name: Download Manifest Archives
      shell: bash
      env:
        PYTHONUNBUFFERED: "1"
        GITHUB_TOKEN: ${{ inputs.github_token }}
        TARGET_REPO: ${{ github.repository }}
        DEBUG: ${{ inputs.debug }}
      working-directory: ${{ inputs.source_location }}
      run: |
        python3 "${GITHUB_ACTION_PATH}/sync.py"
